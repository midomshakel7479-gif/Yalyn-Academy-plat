<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YALYN Academy - منصة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold">YALYN Academy 🎓</h1>
        <div id="userInfo" class="hidden flex items-center space-x-3 space-x-reverse">
            <span id="studentNameDisplay" class="font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1 rounded-md transition">خروج</button>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-3xl">

        <!-- 1. تسجيل الدخول -->
        <div id="loginSection" class="bg-white p-6 rounded-xl shadow-md mt-10">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">تسجيل دخول الطالب</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كود الطالب الخاص بك</label>
                    <input type="text" id="studentCodeInput" placeholder="أدخل الكود الخاص بك" class="w-full border border-gray-300 p-3 rounded-lg text-center font-bold tracking-widest text-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="loginStudent()" id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">دخول المنصة</button>
                <p id="loginError" class="text-red-500 text-center text-sm hidden"></p>
            </div>
        </div>

        <!-- 2. لوحة تحكم الطالب -->
        <div id="dashboardSection" class="hidden space-y-6">
            <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800 text-lg" id="dashName"></h3>
                    <p class="text-sm text-gray-600" id="dashGrade"></p>
                </div>
            </div>

            <!-- الامتحانات المتاحة -->
            <div class="bg-white p-5 rounded-xl shadow-md">
                <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2">الامتحانات المتاحة للصف الدراسي</h3>
                <div id="examsList" class="space-y-3"></div>
            </div>

            <!-- النتائج السابقة -->
            <div class="bg-white p-5 rounded-xl shadow-md">
                <h3 class="font-bold text-lg text-gray-800 mb-4 border-b pb-2">سجل درجاتك السابقة</h3>
                <div id="resultsList" class="space-y-3"></div>
            </div>
        </div>

        <!-- 3. شاشة خوض الامتحان -->
        <div id="examSection" class="hidden bg-white p-6 rounded-xl shadow-md">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 id="examTitleHead" class="font-bold text-xl text-indigo-700"></h2>
                <span id="questionCounter" class="bg-indigo-100 text-indigo-800 text-xs px-3 py-1 rounded-full font-bold"></span>
            </div>

            <div id="questionContainer" class="space-y-4">
                <p id="qText" class="text-lg font-semibold text-gray-800"></p>
                <div id="qImageContainer" class="hidden text-center my-3">
                    <img id="qImage" src="" alt="صورة السؤال" class="max-h-64 mx-auto rounded-lg shadow-sm border">
                </div>

                <div id="optionsContainer" class="space-y-2"></div>
            </div>

            <div class="flex justify-between items-center mt-6 pt-4 border-t">
                <button onclick="prevQuestion()" id="prevBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold disabled:opacity-50">السابق</button>
                <button onclick="nextQuestion()" id="nextBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700">التالي</button>
                <button onclick="submitExam()" id="submitBtn" class="hidden bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">إنهاء وتسليم</button>
            </div>
        </div>

        <!-- 4. شاشة المراجعة بعد التسليم -->
        <div id="reviewSection" class="hidden bg-white p-6 rounded-xl shadow-md space-y-4">
            <div class="text-center border-b pb-4">
                <h2 class="text-2xl font-bold text-gray-800">نتيجة الامتحان</h2>
                <div id="finalScoreDisplay" class="text-3xl font-extrabold text-indigo-600 my-2"></div>
                <p class="text-sm text-gray-500">تم تسجيل نتيجتك بنجاح في النظام.</p>
            </div>
            <div id="reviewList" class="space-y-4"></div>
            <button onclick="showDashboard()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">العودة للوحة الرئيسية</button>
        </div>

    </main>

    <script>
        // ضع رابط الـ Web App الخاص بـ Apps Script هنا
        const API_URL = "YOUR_EXACT_APPS_SCRIPT_WEB_APP_URL_HERE";

        let currentStudent = null;
        let currentQuestions = [];
        let currentExamTitle = "";
        let currentQIndex = 0;
        let userAnswers = {};

        function formatDriveImage(url) {
            if (!url) return '';
            const match = url.match(/(?:id=|\/d\/|src=)([\w-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url;
        }

        async function loginStudent() {
            const code = document.getElementById('studentCodeInput').value.trim();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            if(!code) return alert("يرجى إدخال كود الطالب");

            btn.disabled = true;
            btn.innerText = "جاري التحقق...";
            err.classList.add('hidden');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getStudentData", code: code })
                });
                const data = await res.json();
                
                if(data.success && data.student) {
                    currentStudent = data.student;
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('userInfo').classList.remove('hidden');
                    document.getElementById('studentNameDisplay').innerText = currentStudent.name;
                    loadDashboard();
                } else {
                    err.innerText = "الكود غير صحيح، يرجى التأكد منه والتحقق مجدداً";
                    err.classList.remove('hidden');
                }
            } catch(e) {
                alert("حدث خطأ أثناء الاتصال بالنظام: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "دخول المنصة";
            }
        }

        async function loadDashboard() {
            document.getElementById('dashName').innerText = currentStudent.name;
            document.getElementById('dashGrade').innerText = "الصف الدراسي: " + currentStudent.grade;
            document.getElementById('dashboardSection').classList.remove('hidden');

            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getStudentDashboardData", grade: currentStudent.grade, studentName: currentStudent.name })
            });
            const data = await res.json();

            // عرض الامتحانات
            const examsDiv = document.getElementById('examsList');
            examsDiv.innerHTML = "";
            if(data.exams && data.exams.length > 0) {
                data.exams.forEach(ex => {
                    examsDiv.innerHTML += `
                        <div class="flex justify-between items-center p-3 border rounded-lg bg-gray-50">
                            <span class="font-bold text-gray-700">${ex.examTitle}</span>
                            <button onclick="startExam('${ex.examTitle}')" class="bg-indigo-600 text-white text-sm px-4 py-1.5 rounded-lg font-bold hover:bg-indigo-700">بدء الامتحان</button>
                        </div>
                    `;
                });
            } else {
                examsDiv.innerHTML = `<p class="text-gray-500 text-sm">لا توجد امتحانات متاحة لصفك حالياً.</p>`;
            }

            // عرض النتائج
            const resDiv = document.getElementById('resultsList');
            resDiv.innerHTML = "";
            if(data.results && data.results.length > 0) {
                data.results.forEach(r => {
                    resDiv.innerHTML += `
                        <div class="flex justify-between items-center p-3 border rounded-lg">
                            <div>
                                <p class="font-bold text-gray-800">${r.examTitle}</p>
                                <p class="text-xs text-gray-500">${r.date}</p>
                            </div>
                            <span class="font-extrabold text-indigo-600 text-lg">${r.score}</span>
                        </div>
                    `;
                });
            } else {
                resDiv.innerHTML = `<p class="text-gray-500 text-sm">لم تقم بأداء أي امتحانات بعد.</p>`;
            }
        }

        async function startExam(title) {
            currentExamTitle = title;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('examSection').classList.remove('hidden');
            document.getElementById('examTitleHead').innerText = title;

            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getExamQuestions", examTitle: title })
            });
            const data = await res.json();
            currentQuestions = data.questions || [];
            currentQIndex = 0;
            userAnswers = {};
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentQIndex];
            document.getElementById('questionCounter').innerText = `سؤال ${currentQIndex + 1} من ${currentQuestions.length}`;
            document.getElementById('qText').innerText = q.question;

            // الصورة
            const imgEl = document.getElementById('qImage');
            const imgBox = document.getElementById('qImageContainer');
            if(q.image) {
                imgEl.src = formatDriveImage(q.image);
                imgBox.classList.remove('hidden');
            } else {
                imgBox.classList.add('hidden');
            }

            // الخيارات
            const optsBox = document.getElementById('optionsContainer');
            optsBox.innerHTML = "";

            // التحقق مما إذا كان السؤال اختياري أم مقالي
            const choices = [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => String(c).trim() !== "");

            if(choices.length > 0) {
                choices.forEach(opt => {
                    const isSelected = userAnswers[currentQIndex] === opt;
                    optsBox.innerHTML += `
                        <label class="flex items-center p-3 border rounded-lg cursor-pointer transition ${isSelected ? 'bg-indigo-50 border-indigo-500' : 'hover:bg-gray-50'}">
                            <input type="radio" name="opt" value="${opt}" ${isSelected ? 'checked' : ''} onchange="selectOption('${opt}')" class="ml-3">
                            <span class="text-gray-800 font-medium">${opt}</span>
                        </label>
                    `;
                });
            } else {
                // سؤال مقالي
                optsBox.innerHTML = `
                    <textarea oninput="selectOption(this.value)" placeholder="اكتب إجابتك هنا..." class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">${userAnswers[currentQIndex] || ''}</textarea>
                `;
            }

            // الأزرار
            document.getElementById('prevBtn').disabled = (currentQIndex === 0);
            if(currentQIndex === currentQuestions.length - 1) {
                document.getElementById('nextBtn').classList.add('hidden');
                document.getElementById('submitBtn').classList.remove('hidden');
            } else {
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
            }
        }

        function selectOption(val) { userAnswers[currentQIndex] = val; }
        function nextQuestion() { if(currentQIndex < currentQuestions.length - 1) { currentQIndex++; renderQuestion(); } }
        function prevQuestion() { if(currentQIndex > 0) { currentQIndex--; renderQuestion(); } }

        async function submitExam() {
            if(!confirm("هل أنت تأكد من تسليم الامتحان؟")) return;

            let scoreCount = 0;
            let reviewArr = [];

            currentQuestions.forEach((q, idx) => {
                const uAns = userAnswers[idx] || "بدون إجابة";
                const cAns = q.correctAnswer;
                const isCorrect = String(uAns).trim().toLowerCase() === String(cAns).trim().toLowerCase();
                if(isCorrect) scoreCount++;

                reviewArr.push({
                    question: q.question,
                    studentAns: uAns,
                    correctAns: cAns,
                    isCorrect: isCorrect
                });
            });

            const finalScoreStr = `${scoreCount} / ${currentQuestions.length}`;
            const dateStr = new Date().toLocaleDateString('ar-EG');

            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "saveStudentResult",
                    studentName: currentStudent.name,
                    grade: currentStudent.grade,
                    examTitle: currentExamTitle,
                    score: finalScoreStr,
                    date: dateStr,
                    reviewData: JSON.stringify(reviewArr)
                })
            });

            // عرض شاشة المراجعة
            document.getElementById('examSection').classList.add('hidden');
            document.getElementById('reviewSection').classList.remove('hidden');
            document.getElementById('finalScoreDisplay').innerText = finalScoreStr;

            const revBox = document.getElementById('reviewList');
            revBox.innerHTML = "";
            reviewArr.forEach((item, i) => {
                revBox.innerHTML += `
                    <div class="p-4 border rounded-lg ${item.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                        <p class="font-bold text-gray-800">${i+1}. ${item.question}</p>
                        <p class="text-sm mt-1">إجابتك: <span class="${item.isCorrect ? 'text-green-700' : 'text-red-700'} font-bold">${item.studentAns}</span></p>
                        ${!item.isCorrect ? `<p class="text-sm text-gray-600">الإجابة الصحيحة: <span class="font-bold text-green-700">${item.correctAns}</span></p>` : ''}
                    </div>
                `;
            });
        }

        function showDashboard() {
            document.getElementById('reviewSection').classList.add('hidden');
            loadDashboard();
        }

        function logout() {
            currentStudent = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('examSection').classList.add('hidden');
            document.getElementById('reviewSection').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('studentCodeInput').value = "";
        }
    </script>
</body>
</html>
