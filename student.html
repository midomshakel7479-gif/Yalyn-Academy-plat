<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YALYN Academy - Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0a0a;
    --gold-light: #fde047;
    --gold-main: #fbbf24;
    --gold-dark: #b45309;
    --text-main: #ffffff;
    --text-muted: #9ca3af;
    --line: rgba(251, 191, 36, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text-main); font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1f00 0%, var(--bg-dark) 50%, #000000 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px;
  }
  .app-card {
    width: min(750px, 100%);
    background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
    border: 1px solid rgba(251, 191, 36, 0.15);
    border-radius: 30px; padding: 30px 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
  }
  .brand-title {
    font-size: 50px; margin: 0; font-weight: 900; text-align: center;
    background: linear-gradient(to bottom, #fff7d6, #fbb034, #b45309);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand-subtitle { font-size: 20px; font-weight: 800; color: #fff; text-align: center; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; }
  .input-wrapper { position: relative; margin-bottom: 25px; }
  .field { width: 100%; background: #000; border: 2px solid var(--gold-main); border-radius: 50px; padding: 18px 20px; color: white; outline: 0; font-size: 16px; font-weight: 600; text-align: center; }
  .btn-login { width: 100%; padding: 16px; border-radius: 50px; border: 2px solid #fff; background: linear-gradient(to bottom, #fde047, #f59e0b); color: #000; font-weight: 900; font-size: 20px; cursor: pointer; transition: 0.3s; }
  .btn-login:hover { transform: translateY(-3px); filter: brightness(1.1); }
  .exam-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(251, 191, 36, 0.2); padding: 18px 20px; border-radius: 16px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap:10px; }
  .pill { background: rgba(251, 191, 36, 0.15); color: var(--gold-light); padding: 6px 14px; border-radius: 99px; font-size: 14px; font-weight: 800; border: 1px solid var(--gold-main); white-space:nowrap; }
  .pill-gray { background: #222; color: #777; padding: 6px 14px; border-radius: 99px; font-size: 13px; border: 1px solid #444; white-space:nowrap; }
  .btn { border: 1px solid var(--gold-main); color: #000; padding: 10px 18px; border-radius: 12px; background: linear-gradient(135deg, #fde047, #f59e0b); font-weight: 800; cursor: pointer; font-size: 14px; white-space:nowrap; }
  .q-card { background: linear-gradient(145deg, #1f1f1f, #0d0d0d); border: 1px solid var(--gold-main); border-radius: 20px; padding: 25px; margin-bottom: 22px; direction: ltr; text-align: left; }
  .choice-label { display: flex; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(251, 191, 36, 0.3); padding: 14px 18px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
  .choice-label input[type="radio"] { accent-color: var(--gold-main); width: 20px; height: 20px; }

  .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
  .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .featured-video-badge { display:inline-block; background: linear-gradient(135deg, #fde047, #f59e0b); color:#000; font-size:12px; font-weight:900; padding:4px 12px; border-radius:99px; margin-bottom:10px; }
  .unit-select-wrapper { margin: 20px 0; }
  .unit-select-wrapper select.field { text-align: right; border-radius: 14px; padding: 14px 18px; }
  
  /* الحاوية التي تمنع خروج الجدول عن الإطار وتضيف شريط تمرير عند الحاجة */
  .table-responsive { width: 100%; overflow-x: auto; border-radius: 12px; background: rgba(255,255,255,0.02); }
  .report-table { width: 100%; min-width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }
  .report-table th, .report-table td { padding: 12px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
</style>
</head>
<body>

<div class="app-card" id="app">
  <!-- واجهة تسجيل الدخول -->
  <div id="loginView">
    <div class="brand-title" dir="ltr">YALYAN</div>
    <div class="brand-subtitle" dir="ltr">ACADEMY</div>
    <div class="input-wrapper" dir="ltr">
      <input type="password" id="studentCode" class="field" placeholder="Enter Your Student Code">
    </div>
    <button class="btn-login" onclick="studentLogin()">Login ➔</button>
    <div id="loginError" style="color:#f87171;font-size:15px;text-align:center;margin-top:15px;font-weight:600;"></div>
    <div style="margin-top:40px; border:2px solid var(--gold-main); border-radius:15px; padding:15px; background:#000; text-align:center;">
      <div style="color:var(--gold-main); font-size:14px; font-weight:bold;">Made By :</div>
      <div style="font-weight:800; font-size:18px; color:#fff; margin:5px 0;">Mr. Mohamed Abdulfatah</div>
    </div>
  </div>

  <!-- لوحة تحكم الطالب -->
  <div id="dashboardView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;background:#000;padding:15px;border-radius:18px;border:1px solid rgba(251,191,36,0.2);">
      <div>
        <h2 id="dashStudentName" style="margin:0;color:#fff;font-size:18px;"></h2>
        <span id="dashStudentGrade" style="color:var(--gold-main);font-size:13px;font-weight:600;"></span>
      </div>
      <button onclick="logout()" style="background:transparent;border:1px solid #ef4444;color:#ef4444;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:bold;">خروج</button>
    </div>

    <h3 style="font-size:18px;color:var(--text-main);margin:25px 0 15px;">📜 الامتحانات المتاحة:</h3>
    <div id="examsListContainer"></div>

    <h3 style="font-size:18px;color:var(--text-main);margin:35px 0 15px;">🏆 سجل الدرجات السابقة:</h3>
    <div id="historyListContainer"></div>

    <!-- قسم التقرير الشهري المفصل -->
    <div style="margin-top:35px; background:linear-gradient(145deg, #1f1f1f, #0d0d0d); border:1px solid var(--gold-main); border-radius:20px; padding:20px;">
      <h3 style="font-size:18px; color:var(--gold-main); margin:0 0 15px;">📅 التقرير الشهري المفصل</h3>
      <p style="color:var(--text-muted); font-size:13px;">اختر الشهر لعرض كافة درجاتك وتقييمك العام:</p>
      
      <select id="reportMonthSelect" class="field" onchange="renderMonthlyReport()" style="margin-bottom:20px; border-radius:14px; text-align:right; padding:12px; font-size:14px;">
        <option value="">-- اختر الشهر --</option>
        <option value="9">سبتمبر (9)</option>
        <option value="10">أكتوبر (10)</option>
        <option value="11">نوفمبر (11)</option>
        <option value="12">ديسمبر (12)</option>
        <option value="1">يناير (1)</option>
        <option value="2">فبراير (2)</option>
        <option value="3">مارس (3)</option>
        <option value="4">أبريل (4)</option>
        <option value="5">مايو (5)</option>
      </select>

      <div id="monthlyReportRenderBox">
        <div style="text-align:center; color:#777; padding:10px; font-size:14px;">اختر الشهر من القائمة بالأعلى</div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:35px; border-bottom:1px solid rgba(251,191,36,0.2); padding-bottom:10px;">
       <h3 style="font-size:18px;color:var(--text-main);margin:0;">🎬 الفيديوهات والدروس المسجلة:</h3>
    </div>
    <div id="featuredVideoContainer" style="margin-top:15px;"></div>
    <div class="unit-select-wrapper">
      <select id="unitSelect" class="field" onchange="renderUnitVideos()">
        <option value="">-- اختر الوحدة لعرض فيديوهاتها --</option>
      </select>
    </div>
    <div id="videosListContainer" style="margin-top:15px;"></div>
  </div>

  <!-- واجهة الامتحان -->
  <div id="examView" style="display:none">
    <div style="text-align:center;margin-bottom:20px;border-bottom:1px solid rgba(251,191,36,0.2);padding-bottom:15px;"><h3 style="margin:0;color:var(--gold-main);" dir="ltr">YALYAN ACADEMY</h3></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h3 id="currentExamTitle" style="margin:0;color:#fff;font-size:20px;"></h3>
      <span class="pill" id="questionCountBadge"></span>
    </div>
    <div id="questionsRenderBox"></div>
    <button type="button" class="btn-login" id="finishExamBtn" onclick="submitExam()" style="margin-top:20px;">إنهاء الامتحان (Finish)</button>
    <div id="examStatusMsg" style="text-align:center;color:#f87171;margin-top:15px;font-weight:bold"></div>
  </div>

  <!-- واجهة النتيجة والمراجعة -->
  <div id="reviewView" style="display:none">
    <div style="text-align:center;margin-bottom:20px;border-bottom:1px solid rgba(251,191,36,0.2);padding-bottom:15px;"><h3 style="margin:0;color:var(--gold-main);" dir="ltr">YALYAN ACADEMY</h3></div>
    <div style="text-align:center;margin-bottom:30px">
      <h2 style="margin:0;color:#fff;font-size:26px;">نتيجة الاختبار</h2>
      <div id="finalScoreBadge" style="display:inline-block;padding:15px 40px;border-radius:50px;background:#000;color:var(--gold-main);font-size:36px;font-weight:900;margin:20px 0;border:2px solid var(--gold-main);"></div>
    </div>
    <div id="reviewRenderBox" style="max-height:500px;overflow-y:auto;margin-bottom:25px;"></div>
    <button type="button" class="btn" onclick="loadDashboard()" style="width:100%">العودة إلى اللوحة الرئيسية</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const cfg = window.YALYN_CONFIG || {};
let currentStudent = null;
let activeExamQuestions = [];
let studentCompletedExamIds = new Set();
let globalStudentResults = [];
let globalStudentExternalResults = {};
let globalStudentVideos = [];
let essayAnswers = {}; // يخزن صور الإجابات المقالية (base64) مؤقتاً في الذاكرة فقط حتى لحظة التسليم

const toStr = (v) => (v !== undefined && v !== null ? String(v).trim() : "");

// ضغط الصورة قبل إرسالها: تصغير العرض لـ 900px وإعادة الترميز بصيغة JPEG بجودة 0.6
// هذا يقلل حجم الصورة بشكل كبير جداً (من عدة ميجابايت إلى عشرات الكيلوبايت) قبل رفعها لتوفير سرعة الاتصال
function compressImageToBase64(file, maxWidth = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = () => reject(new Error("تعذر فتح الصورة."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("تعذر قراءة الملف."));
    reader.readAsDataURL(file);
  });
}

async function handleEssayImage(event, idx) {
  const file = event.target.files[0];
  if (!file) return;
  const previewBox = document.getElementById(`essay_preview_${idx}`);
  previewBox.innerHTML = "<span style='color:var(--gold-main);font-size:13px;'>جاري تجهيز الصورة...</span>";
  try {
    const base64 = await compressImageToBase64(file);
    essayAnswers[idx] = base64;
    previewBox.innerHTML = `
      <img src="data:image/jpeg;base64,${base64}" style="max-width:220px;border-radius:10px;border:2px solid var(--gold-main);display:block;margin-top:8px;">
      <div style="color:#4ade80;font-size:13px;font-weight:bold;margin-top:6px;">✅ تم إرفاق الصورة بنجاح (يمكنك الضغط على الزر مرة أخرى لإعادة التصوير)</div>
    `;
  } catch(e) {
    previewBox.innerHTML = "<span style='color:#f87171;font-size:13px;'>تعذرت معالجة الصورة، حاول اختيار صورة أخرى.</span>";
  }
}

async function studentLogin() {
  const code = document.getElementById('studentCode').value.trim();
  const err = document.getElementById('loginError');
  err.textContent = "Checking Credentials...";
  if(!code) { err.textContent = "Please enter your code"; return; }
  try {
    const res = await fetch(cfg.webAppUrl, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getStudentData", code })
    });
    const data = await res.json();
    if(data.success && data.student) {
      currentStudent = data.student; err.textContent = ""; loadDashboard();
    } else {
      err.textContent = "Invalid Student Code!";
    }
  } catch(e) { err.textContent = "Server Connection Error."; }
}

async function loadDashboard() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('examView').style.display = 'none';
  document.getElementById('reviewView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';

  document.getElementById('dashStudentName').textContent = `مرحباً، ${currentStudent.name}`;
  document.getElementById('dashStudentGrade').textContent = `الصف: ${currentStudent.grade}`;

  const examsBox = document.getElementById('examsListContainer');
  const historyBox = document.getElementById('historyListContainer');
  const featuredBox = document.getElementById('featuredVideoContainer');
  const unitSelect = document.getElementById('unitSelect');
  const videosBox = document.getElementById('videosListContainer');

  examsBox.innerHTML = "<div style='color:var(--gold-main);text-align:center;font-size:14px;'>جاري التحميل...</div>";
  historyBox.innerHTML = "";
  featuredBox.innerHTML = "";
  videosBox.innerHTML = "";
  unitSelect.innerHTML = `<option value="">-- اختر الوحدة لعرض فيديوهاتها --</option>`;

  try {
    const res = await fetch(cfg.webAppUrl, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getStudentDashboardData", grade: currentStudent.grade || "", studentName: currentStudent.name || "" })
    });
    const data = await res.json();
    studentCompletedExamIds.clear();
    
    globalStudentResults = data.results || [];
    
    // دعم التوافقية حتى لو لم يتم تحديث الكود الخلفي
    let extRes = data.externalResults;
    globalStudentExternalResults = {};
    if (Array.isArray(extRes)) {
        extRes.forEach(item => {
            if (item.examTitle && item.score) {
                globalStudentExternalResults[item.examTitle] = item.score;
            }
        });
    } else if (typeof extRes === 'object' && extRes !== null) {
        globalStudentExternalResults = extRes;
    }
    
    if(globalStudentResults.length > 0) {
      globalStudentResults.forEach((r, idx) => {
        studentCompletedExamIds.add(toStr(r.examTitle).toLowerCase());
        const reviewBtn = r.reviewData ? `<button class="btn" onclick="openPastReview(${idx})" style="padding:4px 10px;font-size:12px;">مراجعة</button>` : '';
        historyBox.innerHTML += `
          <div class="exam-item">
            <div style="display:flex;align-items:center;gap:10px;">
               <span class="pill" style="direction:ltr;">${r.score}</span>
               ${reviewBtn}
            </div>
            <div style="text-align:left">
              <b style="font-size:15px;">${r.examTitle}</b>
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${r.date}</div>
            </div>
          </div>
        `;
      });
    } else {
      historyBox.innerHTML = "<div style='background:#111;padding:15px;border-radius:12px;color:#777;text-align:center;font-size:14px;'>لا توجد درجات سابقة.</div>";
    }

    if(data.exams && data.exams.length > 0) {
      examsBox.innerHTML = "";
      data.exams.forEach(ex => {
        const isDone = studentCompletedExamIds.has(toStr(ex.examTitle).toLowerCase());
        examsBox.innerHTML += `
          <div class="exam-item">
            ${isDone ? `<span class="pill-gray">مكتمل ✓</span>` : `<button class="btn" onclick="startExam('${ex.examId}', '${encodeURIComponent(ex.examTitle)}')">بدء</button>`}
            <div style="text-align:left"><b style="font-size:15px;color:var(--gold-light)">${ex.examTitle}</b></div>
          </div>
        `;
      });
    } else {
      examsBox.innerHTML = "<div style='background:#111;padding:15px;border-radius:12px;color:#f87171;text-align:center;font-size:14px;'>لا توجد اختبارات متاحة حالياً.</div>";
    }

    globalStudentVideos = data.videos || [];
    if (globalStudentVideos.length > 0) {
      const latest = globalStudentVideos[globalStudentVideos.length - 1];
      featuredBox.innerHTML = `
        <div class="q-card" style="margin-bottom:15px; padding:15px; text-align:right; direction:rtl;">
          <span class="featured-video-badge">🆕 آخر فيديو مضاف</span>
          <h4 style="color:var(--gold-main); margin:0 0 12px 0; font-size:15px;">▶ ${latest.title}</h4>
          <div class="video-wrapper"><iframe src="${latest.url}" allowfullscreen></iframe></div>
        </div>
      `;
      const units = [...new Set(globalStudentVideos.map(v => v.unit || "عام"))];
      units.forEach(u => { unitSelect.innerHTML += `<option value="${u}">${u}</option>`; });
    } else {
      featuredBox.innerHTML = "";
      videosBox.innerHTML = "<div style='background:#111;padding:15px;border-radius:12px;color:#777;text-align:center;font-size:14px;'>لا توجد فيديوهات متاحة لهذا الصف حالياً.</div>";
    }
  } catch(e) { examsBox.innerHTML = "<div style='color:#f87171'>خطأ في الخادم.</div>"; }
}

function parseScoreString(scoreStr) {
  if (!scoreStr) return null;
  let engScore = String(scoreStr).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const match = engScore.match(/(\d+(?:\.\d+)?)\s*(?:\/|\\|-|من)\s*(\d+(?:\.\d+)?)/);
  if (match) {
    return { obtained: parseFloat(match[1]), max: parseFloat(match[2]) };
  }
  return null;
}

function getRatingWord(percent) {
  if (percent >= 85) return "ممتاز";
  if (percent >= 70) return "جيد جدا";
  if (percent >= 65) return "جيد";
  if (percent >= 50) return "مقبول";
  return "ضعيف";
}

function getRatingColor(percent) {
  if (percent >= 85) return "#22c55e"; 
  if (percent >= 70) return "#3b82f6"; 
  if (percent >= 65) return "#eab308"; 
  if (percent >= 50) return "#f97316"; 
  return "#ef4444"; 
}

function renderMonthlyReport() {
  const monthNum = document.getElementById('reportMonthSelect').value;
  const box = document.getElementById('monthlyReportRenderBox');
  
  if (!monthNum) {
    box.innerHTML = "<div style='text-align:center; color:#777; padding:10px;'>اختر الشهر من القائمة بالأعلى</div>";
    return;
  }

  const targetMonth = parseInt(monthNum);
  const monthNames = {
    9: ["سبتمبر", "september", "sep"], 10: ["أكتوبر", "october", "oct"],
    11: ["نوفمبر", "november", "nov"], 12: ["ديسمبر", "december", "dec"],
    1: ["يناير", "january", "jan"], 2: ["فبراير", "february", "feb"],
    3: ["مارس", "march", "mar"], 4: ["أبريل", "april", "apr"], 5: ["مايو", "may"]
  };
  const searchTerms = monthNames[targetMonth] || [];

  // دالة ذكية جداً للبحث عن الشهر
  const isMatch = (dateStr, titleStr) => {
    const title = (titleStr || "").toLowerCase();
    if (searchTerms.some(term => title.includes(term))) return true;
    
    if (dateStr) {
       let engDate = String(dateStr).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
       let nums = engDate.match(/\d+/g);
       if (nums && nums.some(n => parseInt(n) === targetMonth)) return true;
    }
    return false;
  };

  let totalObtained = 0;
  let totalMax = 0;
  let foundAny = false;
  let htmlRows = "";

  // 1. المنصة الإلكترونية
  globalStudentResults.forEach(r => {
    if (isMatch(r.date, r.examTitle)) {
      foundAny = true;
      let scoreText = r.score;
      let ratingBadge = "-";
      const parsed = parseScoreString(scoreText);
      if (parsed && parsed.max > 0) {
        totalObtained += parsed.obtained;
        totalMax += parsed.max;
        let percent = (parsed.obtained / parsed.max) * 100;
        ratingBadge = `<span style="background:${getRatingColor(percent)}25; color:${getRatingColor(percent)}; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; white-space:nowrap;">${getRatingWord(percent)}</span>`;
      }

      htmlRows += `<tr>
                <td style="text-align:right;">${r.examTitle}</td>
                <td><span class="pill" style="font-size:10px; padding:3px 6px;">إلكتروني</span></td>
                <td style="direction:ltr; font-weight:bold; white-space:nowrap;">${scoreText}</td>
                <td>${ratingBadge}</td>
               </tr>`;
    }
  });

  // 2. الامتحانات الورقية والخارجية
  for (const [examName, score] of Object.entries(globalStudentExternalResults)) {
    if (isMatch("", examName)) {
      foundAny = true;
      let scoreText = score;
      let ratingBadge = "-";

      if (!score || String(score).trim() === "") {
        scoreText = `<span style="color:#ef4444; font-size:11px; font-weight:bold; white-space:nowrap;">لم يؤدِ الامتحان</span>`;
      } else {
        const parsed = parseScoreString(score);
        if (parsed && parsed.max > 0) {
          totalObtained += parsed.obtained;
          totalMax += parsed.max;
          let percent = (parsed.obtained / parsed.max) * 100;
          ratingBadge = `<span style="background:${getRatingColor(percent)}25; color:${getRatingColor(percent)}; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; white-space:nowrap;">${getRatingWord(percent)}</span>`;
        }
      }

      htmlRows += `<tr>
                <td style="text-align:right;">${examName}</td>
                <td><span class="pill-gray" style="font-size:10px; padding:3px 6px; background:#b45309; color:#fff; border:0;">ورقي</span></td>
                <td style="direction:ltr; font-weight:bold; color:var(--gold-main); white-space:nowrap;">${scoreText}</td>
                <td>${ratingBadge}</td>
               </tr>`;
    }
  }

  if (!foundAny) {
    box.innerHTML = `<div style="text-align:center; padding:15px; background:rgba(255,0,0,0.1); border-radius:12px; color:#f87171; font-size:14px;">لا توجد درجات مسجلة لك في هذا الشهر.</div>`;
    return;
  }

  const headerHtml = `
    <div style="border-bottom:2px solid var(--gold-main); padding-bottom:12px; margin-bottom:15px; text-align:center;">
      <h2 style="margin:0 0 5px; color:var(--gold-main); font-family:sans-serif; letter-spacing:1px; font-size:18px;" dir="ltr">Mr Mohamed Abdulfatah</h2>
      <div style="font-size:12px; color:var(--text-muted);">YALYN Academy - التقرير الشهري للأداء</div>
    </div>
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; background:rgba(0,0,0,0.5); padding:12px; border-radius:12px; margin-bottom:15px; border:1px solid rgba(251,191,36,0.3);">
      <div style="font-size:13px;"><span style="color:var(--text-muted);">اسم الطالب:</span> <b style="color:#fff;">${currentStudent.name}</b></div>
      <div style="font-size:13px;"><span style="color:var(--text-muted);">رقم ولي الأمر:</span> <b style="color:#fff;" dir="ltr">${currentStudent.phone || 'غير مسجل'}</b></div>
    </div>
  `;

  const tableHtml = `
    <div class="table-responsive">
      <table class="report-table">
        <tr style="background:rgba(251,191,36,0.1); color:var(--gold-main);">
          <th style="text-align:right;">الامتحان</th>
          <th>النوع</th>
          <th>الدرجة</th>
          <th>التقييم</th>
        </tr>
        ${htmlRows}
      </table>
    </div>
  `;

  let overallHtml = "";
  if (totalMax > 0) {
    let overallPercent = (totalObtained / totalMax) * 100;
    let overallWord = getRatingWord(overallPercent);
    let overallColor = getRatingColor(overallPercent);

    overallHtml = `
      <div style="margin-top:20px; padding:15px; background:rgba(0,0,0,0.6); border:1px solid ${overallColor}50; border-radius:15px; display:flex; justify-content:space-around; align-items:center; flex-wrap:wrap; gap:10px;">
        <div style="text-align:center;">
          <div style="color:var(--text-muted); font-size:12px; margin-bottom:4px;">إجمالي الشهر</div>
          <div style="font-size:18px; font-weight:bold; color:#fff;" dir="ltr">${totalObtained} / ${totalMax}</div>
        </div>
        <div style="text-align:center;">
          <div style="color:var(--text-muted); font-size:12px; margin-bottom:4px;">النسبة العامة</div>
          <div style="font-size:20px; font-weight:900; color:${overallColor};" dir="ltr">${overallPercent.toFixed(1)}%</div>
        </div>
        <div style="text-align:center;">
          <div style="color:var(--text-muted); font-size:12px; margin-bottom:4px;">التقييم العام</div>
          <div style="font-size:16px; font-weight:bold; background:${overallColor}; color:#000; padding:4px 16px; border-radius:50px;">${overallWord}</div>
        </div>
      </div>
    `;
  }

  box.innerHTML = headerHtml + tableHtml + overallHtml;
}

function renderUnitVideos() {
  const unitSelect = document.getElementById('unitSelect');
  const videosBox = document.getElementById('videosListContainer');
  const selectedUnit = unitSelect.value;
  if (!selectedUnit) { videosBox.innerHTML = ""; return; }

  const filtered = globalStudentVideos.filter(v => (v.unit || "عام") === selectedUnit);
  if (filtered.length === 0) {
    videosBox.innerHTML = "<div style='background:#111;padding:15px;border-radius:12px;color:#777;text-align:center;font-size:14px;'>لا توجد فيديوهات في هذه الوحدة.</div>";
    return;
  }
  videosBox.innerHTML = "";
  filtered.forEach(v => {
    videosBox.innerHTML += `
      <div class="q-card" style="margin-bottom:15px; padding:15px; text-align:right; direction:rtl;">
        <h4 style="color:var(--gold-main); margin:0 0 12px 0; font-size:15px;">▶ ${v.title}</h4>
        <div class="video-wrapper"><iframe src="${v.url}" allowfullscreen></iframe></div>
      </div>
    `;
  });
}

async function startExam(examId, encodedTitle) {
  const examTitle = decodeURIComponent(encodedTitle);
  if(studentCompletedExamIds.has(toStr(examTitle).toLowerCase())) { alert("لقد أتممت هذا الاختبار مسبقاً."); return; }
  document.getElementById('dashboardView').style.display = 'none'; document.getElementById('examView').style.display = 'block'; document.getElementById('currentExamTitle').textContent = examTitle; document.getElementById('questionsRenderBox').innerHTML = "<div style='text-align:center;padding:40px;color:var(--gold-main);font-size:16px;'>جاري التجهيز...</div>";
  try {
    const res = await fetch(cfg.webAppUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getExamQuestions", examId, examTitle, grade: currentStudent.grade }) });
    const data = await res.json();
    activeExamQuestions = data.questions || [];
    if (activeExamQuestions.length === 0) throw new Error("لا توجد أسئلة نشطة في هذا الاختبار.");
    document.getElementById('questionCountBadge').textContent = `${activeExamQuestions.length} Questions`;
    const box = document.getElementById('questionsRenderBox'); box.innerHTML = "";
    essayAnswers = {};
    activeExamQuestions.forEach((q, idx) => {
      const c1 = toStr(q.choice1), c2 = toStr(q.choice2), c3 = toStr(q.choice3), c4 = toStr(q.choice4); const isMcq = c1 !== "";
      const qType = toStr(q.qType).toLowerCase();
      let rawUrl = toStr(q.image).replace(/['"]/g, '').trim(); let finalImgUrl = "";
      if (rawUrl) {
        let fileId = "";
        if (rawUrl.includes('/d/')) { const parts = rawUrl.split('/d/'); if (parts[1]) fileId = parts[1].split('/')[0]; } else if (rawUrl.includes('id=')) { const urlParams = new URLSearchParams(rawUrl.split('?')[1]); fileId = urlParams.get('id'); }
        if (fileId) { finalImgUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`; } else { finalImgUrl = rawUrl; }
      }
      const imageHtml = finalImgUrl ? `<div style="text-align:center;"><img src="${finalImgUrl}" referrerpolicy="no-referrer" style="max-width:100%; border-radius:12px; margin-bottom:18px; border:2px solid var(--gold-main);" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x200?text=Image+Load+Error';"></div>` : "";
      const questionText = toStr(q.question) !== "" ? `<div style="font-size:16px;font-weight:800;margin-bottom:18px;color:#fff;"><span style="color:var(--gold-main);">${idx + 1}.</span> ${toStr(q.question)}</div>` : "";

      let answerBlockHtml;
      if (qType === 'essay') {
        answerBlockHtml = `
          <input type="file" accept="image/*" capture="environment" id="essay_file_${idx}" style="display:none" onchange="handleEssayImage(event, ${idx})">
          <button type="button" class="btn" style="width:100%; padding:14px; font-size:15px;" onclick="document.getElementById('essay_file_${idx}').click()">📷 صوّر إجابتك</button>
          <div id="essay_preview_${idx}" style="margin-top:12px;"></div>
        `;
      } else if (isMcq) {
        answerBlockHtml = `
            <div>
              <label class="choice-label"><input type="radio" name="q_${idx}" value="${c1}"> <span>${c1}</span></label>
              <label class="choice-label"><input type="radio" name="q_${idx}" value="${c2}"> <span>${c2}</span></label>
              <label class="choice-label"><input type="radio" name="q_${idx}" value="${c3}"> <span>${c3}</span></label>
              <label class="choice-label"><input type="radio" name="q_${idx}" value="${c4}"> <span>${c4}</span></label>
            </div>
          `;
      } else {
        answerBlockHtml = `
            <input type="text" id="complete_ans_${idx}" style="width:100%;background:#000;border:2px solid rgba(251,191,36,0.5);border-radius:12px;padding:15px;color:#fde047;font-size:16px;font-weight:bold;direction:ltr;" placeholder="Type answer here...">
          `;
      }

      box.innerHTML += `
        <div class="q-card">
          ${questionText} ${imageHtml}
          ${answerBlockHtml}
        </div>
      `;
    });
  } catch(e) { document.getElementById('questionsRenderBox').innerHTML = `<div style='background:#111;color:#f87171;text-align:center;padding:20px;border-radius:15px;font-size:14px;'>${e.message}</div>`; }
}
async function submitExam() {
  const finishBtn = document.getElementById('finishExamBtn');
  const statusMsg = document.getElementById('examStatusMsg');
  finishBtn.disabled = true;
  let score = 0;
  const reviewList = [];
  const essayIndexes = [];

  // أولاً: نصحح كل الأسئلة العادية (اختيارات / إكمال) فوراً كما كان
  activeExamQuestions.forEach((q, idx) => {
    const qType = toStr(q.qType).toLowerCase();
    if (qType === 'essay') { essayIndexes.push(idx); return; }
    let studentAns = ""; const isMcq = toStr(q.choice1) !== "";
    if(isMcq) { const checked = document.querySelector(`input[name="q_${idx}"]:checked`); if(checked) studentAns = toStr(checked.value); } else { const inp = document.getElementById(`complete_ans_${idx}`); if(inp) studentAns = toStr(inp.value); }
    const cleanStudentAns = studentAns.replace(/[, ]/g, '').toLowerCase(); const cleanCorrectAns = toStr(q.correctAnswer).replace(/[, ]/g, '').toLowerCase();
    const isCorrect = (cleanStudentAns === cleanCorrectAns); if(isCorrect) score++;
    reviewList[idx] = { question: toStr(q.question), studentAns: studentAns || "No Answer", correctAns: toStr(q.correctAnswer), isCorrect: isCorrect, qType: 'normal' };
  });

  // ثانياً: الأسئلة المقالية تُصحح بالذكاء الاصطناعي (كل سؤال على حدة، بالترتيب)
  if (essayIndexes.length > 0) {
    finishBtn.textContent = "جاري التصحيح...";
    statusMsg.style.color = 'var(--gold-main)';
    statusMsg.textContent = "جاري تصحيح الأسئلة المقالية بالذكاء الاصطناعي، برجاء الانتظار ولا تغلق الصفحة...";

    for (const idx of essayIndexes) {
      const q = activeExamQuestions[idx];
      const imgBase64 = essayAnswers[idx];
      if (!imgBase64) {
        reviewList[idx] = { question: toStr(q.question), studentAns: "لم يتم رفع صورة", correctAns: "", isCorrect: false, qType: 'essay', essayScore: 0, essayFeedback: "لم يقم الطالب برفع صورة لإجابته على هذا السؤال." };
        continue;
      }
      try {
        const res = await fetch(cfg.webAppUrl, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "gradeEssayWithGemini", imageBase64: imgBase64, question: toStr(q.question) })
        });
        const data = await res.json();
        const essayScore = data.success ? (parseFloat(data.score) || 0) : 0;
        const essayFeedback = data.success ? (data.feedback || "") : "تعذر تصحيح هذا السؤال تلقائياً، سيتم مراجعته من قبل المعلم.";
        score += (essayScore / 10); // توحيد وزن السؤال المقالي مع باقي الأسئلة (كل سؤال = نقطة واحدة)
        reviewList[idx] = { question: toStr(q.question), studentAns: "📷 تم تصوير الإجابة وتصحيحها", correctAns: "", isCorrect: essayScore >= 5, qType: 'essay', essayScore: essayScore, essayFeedback: essayFeedback };
      } catch(e) {
        reviewList[idx] = { question: toStr(q.question), studentAns: "📷 تم تصوير الإجابة", correctAns: "", isCorrect: false, qType: 'essay', essayScore: 0, essayFeedback: "حدث خطأ في الاتصال بخدمة التصحيح الذكي." };
      }
    }
    statusMsg.textContent = "";
  }

  finishBtn.textContent = "جاري الحفظ...";
  const totalQuestions = activeExamQuestions.length > 0 ? activeExamQuestions.length : 15;
  const displayScore = Number.isInteger(score) ? score : score.toFixed(1);
  const finalScoreString = `${displayScore} / ${totalQuestions}`;
  const examTitle = document.getElementById('currentExamTitle').textContent;
  const reviewDataStr = JSON.stringify(reviewList);
  try {
    await fetch(cfg.webAppUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "saveStudentResult", studentName: currentStudent.name, grade: currentStudent.grade, examTitle: examTitle, score: finalScoreString, date: new Date().toLocaleDateString('ar-EG'), reviewData: reviewDataStr }) });
    studentCompletedExamIds.add(toStr(examTitle).toLowerCase());
    finishBtn.disabled = false; finishBtn.textContent = "إنهاء الامتحان (Finish)";
    essayAnswers = {}; // حذف الصور من الذاكرة فوراً بعد الحفظ - لا تُخزن أي صورة في الشيت أو في المتصفح بعد هذه اللحظة
    renderReviewScreen(reviewList, finalScoreString);
  } catch(e) {
    statusMsg.textContent = "خطأ في الحفظ، يرجى المحاولة مرة أخرى.";
    finishBtn.disabled = false;
    finishBtn.textContent = "إنهاء الامتحان (Finish)";
  }
}
function openPastReview(idx) {
  const r = globalStudentResults[idx]; if(!r || !r.reviewData) return;
  let parsedReview = []; try { parsedReview = JSON.parse(r.reviewData); } catch(e) { alert("تعذر تحميل المراجعة."); return; }
  renderReviewScreen(parsedReview, r.score);
}
function renderReviewScreen(reviewList, scoreStr) {
  document.getElementById('dashboardView').style.display = 'none'; document.getElementById('examView').style.display = 'none'; document.getElementById('reviewView').style.display = 'block'; document.getElementById('finalScoreBadge').textContent = scoreStr;
  const reviewBox = document.getElementById('reviewRenderBox'); reviewBox.innerHTML = "";
  reviewList.forEach((item, i) => {
    if (!item) return;
    if (item.qType === 'essay') {
      reviewBox.innerHTML += `
        <div style="border-radius:18px;padding:15px;margin-bottom:15px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);direction:rtl;text-align:right;border-right:5px solid ${item.essayScore >= 5 ? '#22c55e' : '#ef4444'};">
          <div style="font-weight:bold;color:#fff;font-size:15px;margin-bottom:10px;"><span style="color:var(--gold-main);">${i + 1}.</span> ${item.question} <span class="pill" style="font-size:11px; margin-right:6px;">مقالي</span></div>
          <div style="font-size:14px;margin-bottom:8px;background:#000;padding:10px;border-radius:8px;">تقييم الذكاء الاصطناعي: <b style="color:var(--gold-main);" dir="ltr">${item.essayScore} / 10</b></div>
          ${item.essayFeedback ? `<div style="font-size:13px;color:#ccc;background:rgba(255,255,255,0.05);padding:10px;border-radius:8px;">${item.essayFeedback}</div>` : ''}
        </div>
      `;
      return;
    }
    reviewBox.innerHTML += `
      <div style="border-radius:18px;padding:15px;margin-bottom:15px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);direction:ltr;text-align:left;border-left:5px solid ${item.isCorrect ? '#22c55e' : '#ef4444'};">
        <div style="font-weight:bold;color:#fff;font-size:15px;margin-bottom:10px;"><span style="color:var(--gold-main);">${i + 1}.</span> ${item.question}</div>
        <div style="font-size:14px;margin-bottom:8px;background:#000;padding:10px;border-radius:8px;">Your Answer: <span style="color:${item.isCorrect ? '#4ade80' : '#f87171'}">${item.studentAns}</span></div>
        ${!item.isCorrect ? `<div style="font-size:14px;color:#4ade80;background:rgba(34,197,94,0.1);padding:10px;border-radius:8px;">Correct Answer: <b>${item.correctAns}</b></div>` : ''}
      </div>
    `;
  });
}
function logout() { currentStudent = null; document.getElementById('studentCode').value = ''; document.getElementById('dashboardView').style.display = 'none'; document.getElementById('examView').style.display = 'none'; document.getElementById('reviewView').style.display = 'none'; document.getElementById('loginView').style.display = 'block'; }
</script>
